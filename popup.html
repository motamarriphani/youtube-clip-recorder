<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Clip Recorder Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 12px;
      min-width: 300px;
      color: #111827;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    h2 {
      margin: 12px 0 8px;
      font-size: 13px;
      color: #374151;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background: #f9fafb;
    }

    .steps {
      margin: 0;
      padding-left: 18px;
      font-size: 12px;
      line-height: 1.45;
      color: #1f2937;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    #readiness {
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
    }

    #readiness.ready {
      color: #0f766e;
    }

    #readiness.warning {
      color: #b45309;
    }

    #readiness.error {
      color: #b42318;
    }

    label,
    button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
    }

    .duration-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .duration-option {
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      background: #ffffff;
      color: #111827;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .duration-option.is-active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
    }

    button {
      cursor: pointer;
    }

    #status {
      font-size: 12px;
      min-height: 16px;
      color: #1a7f37;
    }
  </style>
</head>
<body>
  <h1>YouTube Clip Recorder</h1>

  <div class="card">
    <h2>Quick Start</h2>
    <ol class="steps">
      <li>Open a YouTube watch page.</li>
      <li>Click this extension icon once on that tab.</li>
      <li>Press <strong>REC Clip</strong> on the player controls.</li>
      <li>Stop recording and choose download with/without audio in preview.</li>
    </ol>
  </div>

  <div class="card">
    <h2>Capture Readiness</h2>
    <div class="row">
      <div id="readiness" class="warning">Not checked</div>
      <button id="checkReadiness" type="button">Check</button>
    </div>
  </div>

  <div class="card">
    <h2>Settings</h2>
    <label>Max recording duration</label>
    <div id="durationOptions" class="duration-grid">
      <button class="duration-option" data-seconds="3" type="button">3 seconds</button>
      <button class="duration-option" data-seconds="5" type="button">5 seconds</button>
      <button class="duration-option" data-seconds="10" type="button">10 seconds</button>
      <button class="duration-option" data-seconds="15" type="button">15 seconds</button>
      <button class="duration-option" data-seconds="20" type="button">20 seconds</button>
      <button class="duration-option" data-seconds="30" type="button">30 seconds</button>
      <button class="duration-option" data-seconds="45" type="button">45 seconds</button>
      <button class="duration-option" data-seconds="60" type="button">60 seconds</button>
    </div>
    <button id="save" type="button">Save</button>
    <div id="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
